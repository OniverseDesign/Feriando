<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EDF7" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3EDF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141218" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <title>Feriando — Gestión de Ventas</title>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('feriando_pref_theme');
          var mode = pref ? JSON.parse(pref) : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            metas.forEach(function(meta) {
              meta.setAttribute('content', '#141218');
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
